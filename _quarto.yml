project:
  type: website
  output-dir: docs

website:
  title: "Estatística & ML"
  description: "Portfólio de análises e aprendizado em estatística e machine learning"
  site-url: "https://humbertobonizzi.github.io/estatistica"
  navbar:
    left:
      - href: index.qmd
        text: Início
      - href: analises/index.qmd
        text: Análises
      - href: aprendizado/index.qmd
        text: Aprendizado
      - href: sobre.qmd
        text: Sobre
    right:
      - icon: github
